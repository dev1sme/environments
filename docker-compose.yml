# Root KHÔNG khai service nào — mỗi tool giữ docker-compose.yml riêng trong
# thư mục của nó. Cách thêm tool mới + 2 chỗ dễ sai: README.md

include:
  - path: tools/proxy/docker-compose.yml
    env_file: .env
  - path: tools/postgres/docker-compose.yml
    env_file: .env
  - path: tools/mongodb/docker-compose.yml
    env_file: .env
  - path: tools/coredns/docker-compose.yml
    env_file: .env
  - path: tools/codegraph/docker-compose.yml
    env_file: .env
  - path: tools/homepage/docker-compose.yml
    env_file: .env
  - path: tools/docs/docker-compose.yml
    env_file: .env

networks:
  env-net:
    name: env-net
