# Root compose KHÔNG khai service nào. Mỗi tool giữ docker-compose.yml riêng
# trong thư mục của nó, ở đây chỉ include vào.
#
# Vì sao `include` thay vì khai hết ở đây:
#   - config của 1 tool nằm cạnh file của tool đó (conf.d/, init/, zones/)
#   - vẫn CÙNG 1 compose project nên `docker compose ps` thấy hết, và gọi được
#     bằng tên service: `docker compose up -d proxy`
#   - `env_file: .env` lo interpolation cho file được include, khỏi phải
#     truyền `--env-file` như khi dùng `-f`
#
# 2 bẫy khi thêm tool mới (đã đâm phải, xem tools/codegraph/README.md):
#   1. File được include KHÔNG được khai `external: true` cho env-net — hai
#      khai báo bị merge, network gộp thành external, máy mới `make up` fail.
#      Khai `name: env-net` giống ở dưới.
#   2. Đường dẫn tương đối trong file được include resolve theo THƯ MỤC CỦA
#      FILE ĐÓ, không phải root. `./conf.d`, không phải `./tools/proxy/conf.d`.

include:
  - path: tools/proxy/docker-compose.yml
    env_file: .env
  - path: tools/postgres/docker-compose.yml
    env_file: .env
  - path: tools/coredns/docker-compose.yml
    env_file: .env
  - path: tools/codegraph/docker-compose.yml
    env_file: .env

networks:
  env-net:
    name: env-net
