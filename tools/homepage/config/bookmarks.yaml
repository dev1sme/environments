---
# Link VIẾT TAY, hiện bên dưới nhóm Apps. Sửa xong F5 là thấy, không cần reload.
# services.yaml là file sinh tự động — đừng thêm link vào đó, `make reload` sẽ ghi đè.
# https://gethomepage.dev/configs/bookmarks/
#
# - Nhóm:                         # tên nhóm, hiện thành 1 cột
#     - Tên link:
#         - href: https://...     # bắt buộc
#           abbr: GH              # 2 chữ hiện thay icon
#           icon: github.png      # hoặc icon (dashboard-icons *.png / mdi-*), thay abbr
#           description: ...      # dòng chữ nhỏ bên dưới, tuỳ chọn

- Dev env:
    - Tài liệu:
        - href: https://docs.thomson.cba
          icon: mdi-book-open-page-variant-outline
          description: markdown trong docs/
