# Postgres dùng chung. Database + role tạo bằng tay (DBeaver / `make psql`).
# Lý do chọn image debian, md5, và override password_encryption: xem README.md

networks:
  env-net:
    name: env-net

services:
  postgres:
    image: postgres:16
    container_name: env-postgres
    restart: unless-stopped
    # Giữ default hash là SCRAM (initdb tự đặt md5 khi --auth-host=md5)
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Luật rộng: nhận cả md5 và SCRAM. Chỉ tác dụng lúc .data/postgres trống.
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      # Cho DBeaver trên host. Container khác gọi qua tên `postgres:5432`.
      - "127.0.0.1:5432:5432"
    volumes:
      - ../../.data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - env-net
