<!DOCTYPE html>
<!--
  Docsify cho https://docs.$DOMAIN — render markdown trong ../../docs/ ở phía
  trình duyệt. Không build, không container: nginx serve file này + file .md.
  Sidebar tự sinh từ /__list/ (nginx autoindex JSON), thêm file là có ngay.
  Chi tiết: README.md
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tài liệu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    .md-download {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--theme-color, #42b983);
      border-radius: 4px;
      font-size: 0.9rem;
      text-decoration: none !important;
    }
  </style>
</head>
<body>
  <div id="app">Đang tải…</div>
  <script>
    // Tên file -> tiêu đề: bỏ .md, gạch nối/gạch dưới -> dấu cách.
    const title = (name) => name.replace(/\.md$/i, '').replace(/[-_]+/g, ' ');

    // Duyệt đệ quy /__list/<dir>/, trả về cây { files: [...], dirs: {name: cây} }.
    // Bỏ file/thư mục bắt đầu bằng _ (quy ước docsify cho file đặc biệt).
    async function scan(dir) {
      const res = await fetch('/__list/' + dir, { cache: 'no-store' });
      const tree = { files: [], dirs: {} };
      if (!res.ok) return tree;
      for (const e of await res.json()) {
        if (e.name.startsWith('_')) continue;
        if (e.type === 'directory') tree.dirs[e.name] = await scan(dir + e.name + '/');
        else if (/\.md$/i.test(e.name)) tree.files.push(dir + e.name);
      }
      return tree;
    }

    function sidebar(tree, depth = 0) {
      const pad = '  '.repeat(depth);
      let md = '';
      for (const f of tree.files.sort()) {
        if (depth === 0 && /^readme\.md$/i.test(f)) continue;
        md += `${pad}- [${title(f.split('/').pop())}](${encodeURI(f)})\n`;
      }
      for (const [name, sub] of Object.entries(tree.dirs).sort()) {
        md += `${pad}- **${name}**\n` + sidebar(sub, depth + 1);
      }
      return md;
    }

    function listing(tree) {
      const all = [];
      (function walk(t) { all.push(...t.files); Object.values(t.dirs).forEach(walk); })(tree);
      if (!all.length) return '# Tài liệu\n\nChưa có file `.md` nào trong `docs/`.';
      return '# Tài liệu\n\n' + all.sort().map((f) => `- [${f}](${encodeURI(f)})`).join('\n');
    }

    // Docsify đọc _sidebar.md / README.md qua XHR. Chặn 2 request đó, trả về
    // markdown sinh từ cây thư mục — khỏi phải viết tay _sidebar.md.
    function serve(files) {
      const open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        const path = new URL(url, location.href).pathname;
        for (const [name, body] of Object.entries(files)) {
          if (path === '/' + name) {
            url = URL.createObjectURL(new Blob([body], { type: 'text/markdown' }));
            break;
          }
        }
        return open.call(this, method, url, ...rest);
      };
    }

    (async () => {
      const tree = await scan('');
      const hasReadme = tree.files.some((f) => /^readme\.md$/i.test(f));
      const files = { '_sidebar.md': `- [Trang chủ](/)\n${sidebar(tree)}` };
      if (!hasReadme) files['README.md'] = listing(tree);
      serve(files);

      window.$docsify = {
        name: 'Tài liệu',
        loadSidebar: true,
        alias: { '/.*/_sidebar.md': '/_sidebar.md' },
        subMaxLevel: 2,
        auto2top: true,
        search: { placeholder: 'Tìm…', noData: 'Không thấy', depth: 3 },
        plugins: [
          (hook, vm) => {
            // Nút tải file gốc. README sinh tự động thì không có file để tải.
            hook.afterEach((html) => {
              // route.file đã encode sẵn (dấu cách -> %20), không encode lần nữa.
              const file = vm.route.file;
              if (!file || file in files) return html;
              return html + `<a class="md-download" href="/${file}" download>⬇ Tải file .md</a>`;
            });
          },
        ],
      };

      // Plugin phải nạp TRƯỚC docsify: nạp động sau khi DOM xong thì docsify
      // khởi động ngay lúc script của nó load, plugin đến sau không kịp đăng ký.
      // Ngôn ngữ prism cần Prism của docsify nên nạp sau, rồi highlight lại.
      for (const src of [
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js',
        'https://cdn.jsdelivr.net/npm/docsify-copy-code@3',
        'https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js',
        'https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js',
      ]) {
        await new Promise((ok, fail) => {
          const s = document.createElement('script');
          s.src = src; s.onload = ok; s.onerror = fail;
          document.body.appendChild(s);
        });
      }
      window.Prism.highlightAll();
    })();
  </script>
</body>
</html>
