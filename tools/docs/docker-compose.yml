# Tài liệu markdown https://docs.$DOMAIN — Zensical đọc thẳng docs/ ở
# gốc repo, tự reload khi file đổi. Chi tiết: README.md

networks:
  env-net:
    name: env-net

services:
  docs:
    image: zensical/zensical:latest
    container_name: env-docs
    restart: unless-stopped
    command: serve -f /docs/mkdocs.yml -a 0.0.0.0:8000
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./overrides:/docs/overrides:ro
      - ../../docs:/docs/content:ro
    networks:
      - env-net
