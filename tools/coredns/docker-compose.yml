# DNS nội bộ cho *.$DOMAIN. DƯ trong LAN công ty (đã resolve sẵn) — chỉ cần
# khi demo ở mạng khác. Chi tiết: README.md

networks:
  env-net:
    name: env-net

services:
  coredns:
    image: coredns/coredns:latest
    container_name: env-coredns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      # Bind IP LAN, KHÔNG 0.0.0.0 — systemd-resolved giữ 127.0.0.53:53
      - "${HOST_IP}:53:53/udp"
      - "${HOST_IP}:53:53/tcp"
    volumes:
      # Mount cả thư mục: `make dns-init` tạo file mới, mount lẻ file chưa
      # tồn tại là docker tạo thành directory
      - .:/etc/coredns:ro
    networks:
      - env-net
