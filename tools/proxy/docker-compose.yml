# nginx reverse proxy + TLS. Đường dẫn tương đối resolve theo THƯ MỤC NÀY.
# Chi tiết: README.md

networks:
  env-net:
    name: env-net

services:
  proxy:
    image: nginx:alpine
    container_name: env-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./auth:/etc/nginx/auth:ro
      - ../ssl-cert:/etc/nginx/ssl:ro
      - ../../assets:/usr/share/nginx/assets:ro
    # Để với tới service chạy network_mode: host (hiện không app nào dùng)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - env-net
