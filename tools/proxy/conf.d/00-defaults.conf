# Config dùng chung cho mọi vhost. Prefix 00- vì nginx include theo alphabet.
# Mọi directive ở đây nằm trong context `http`. Chi tiết: ../README.md

# vhost của app — thư mục này gitignore, nginx gốc chỉ include conf.d/*.conf
# nên phải include tay tầng con.
include /etc/nginx/conf.d/vhosts/*.conf;

# BẮT BUỘC cho upstream dạng biến. 127.0.0.11 = embedded DNS của Docker.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

# Default nginx là 1m — upload ảnh là ăn 413
client_max_body_size 3000M;

proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
send_timeout          300s;

# Có upgrade thì "upgrade", không thì "close". Hardcode "upgrade" là sai với
# request HTTP thường.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Badge "DEV ENV" — inject tự động, app không cần sửa source.
# Đường dẫn CÙNG ORIGIN, route bởi snippets/dev-badge.conf.
map $host $dev_script {
    ~^api      '';
    ~^assets   '';
    default    '<script src="/__dev/dev.js"></script>';
}

# sub_filter_types default chỉ text/html nên JSON và static không bị chạm
sub_filter '</body>' '$dev_script</body>';
sub_filter_once on;
