# Cấu hình dùng chung cho mọi vhost — file này load trước (prefix 00-)
# vì nginx include theo thứ tự alphabet.
#
# Mọi directive ở đây nằm trong context `http` (conf.d/*.conf được include
# bên trong http block của nginx.conf gốc), nên không cần build image riêng
# để thay nginx.conf như docker-starfish làm.

##############################################################
# Resolver — BẮT BUỘC cho upstream dạng biến
##############################################################
# 127.0.0.11 là embedded DNS của Docker, có trong mọi user-defined network.
# Không có dòng này thì `proxy_pass $upstream` báo:
#   no resolver defined to resolve <name>
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

##############################################################
# Giới hạn request / timeout
##############################################################
# Default của nginx là 1m — upload ảnh trong demo là ăn 413 ngay.
client_max_body_size 3000M;

proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
send_timeout          300s;

##############################################################
# WebSocket upgrade
##############################################################
# docker-starfish hardcode `Connection "upgrade"` ở mọi block — sai với
# request HTTP thường, vì gửi header upgrade cho request không phải WS.
# Map lại theo $http_upgrade: có upgrade thì "upgrade", không thì "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

##############################################################
# Badge "DEV ENV" — tự inject, app không cần sửa source
##############################################################
# Domain khớp `api*` và host assets thì không inject: response là JSON/static,
# nhúng script vào vô nghĩa.
#
# Đường dẫn CÙNG ORIGIN, không phải //assets.thomson.cba/dev.js.
# Cross-origin thì thiết bị chưa có CYBRIDGE ASIA Root CA (điện thoại, máy khách)
# bị browser chặn script im lặng — trang chạy mà không có badge.
# Route /__dev/dev.js do snippets/dev-badge.conf lo, include trong từng server block.
map $host $dev_script {
    ~^api      '';
    ~^assets   '';
    default    '<script src="/__dev/dev.js"></script>';
}

# sub_filter chỉ áp dụng cho text/html (default của sub_filter_types),
# nên JSON và static file không bị chạm tới.
sub_filter '</body>' '$dev_script</body>';
sub_filter_once on;
