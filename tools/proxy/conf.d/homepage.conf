# Dashboard dev env — danh sách vhost sinh từ conf.d. Xem ../../homepage/README.md

server {
    listen 80;
    server_name home.thomson.cba;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name home.thomson.cba;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;

    include /etc/nginx/snippets/dev-badge.conf;

    location / {
        set $upstream http://homepage:3000;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $upstream;
    }
}
