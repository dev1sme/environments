# Tài liệu markdown cho cả LAN — KHÔNG có auth. Xem ../../docs/README.md
#   /        zensical (container docs)
#   /raw/    file .md gốc trong docs/ ở gốc repo, cho nút tải
#   /edit/   không dùng — chỉ là tiền tố để theme sinh link /raw/ (mkdocs.yml)

server {
    listen 80;
    server_name docs.thomson.cba;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.thomson.cba;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;

    include /etc/nginx/snippets/dev-badge.conf;

    location /raw/ {
        alias /usr/share/nginx/docs/;
        # mime.types của nginx không có .md -> octet-stream. Khai rõ type đúng.
        types { }
        default_type "text/markdown; charset=utf-8";
        # Nút "view" của theme là link thường (không có thuộc tính download)
        # -> ép tải ở đây, tên file lấy từ cuối URL.
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    location / {
        set $upstream http://docs:8000;
        # Không include proxy-params.conf: zensical serve trả 400 khi Host là
        # hostname (chỉ nhận localhost/IP), nên Host phải ghi đè. Thêm một
        # proxy_set_header Host thứ hai thì nginx gửi cả hai header.
        proxy_set_header Host              localhost:8000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_pass $upstream;
    }
}
