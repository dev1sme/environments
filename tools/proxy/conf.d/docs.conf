# Tài liệu markdown cho cả LAN — KHÔNG có auth. Xem ../../docs/README.md
#   /            tools/docs/index.html (docsify)
#   /__list/     danh sách file dạng JSON, index.html dựng sidebar từ đây
#   /<file>.md   file gốc trong docs/ ở gốc repo

server {
    listen 80;
    server_name docs.thomson.cba;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.thomson.cba;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;

    include /etc/nginx/snippets/dev-badge.conf;

    root /usr/share/nginx/docs;
    charset utf-8;
    add_header Cache-Control "no-store";

    location = / {
        root /usr/share/nginx/docs-ui;
        try_files /index.html =404;
    }

    location /__list/ {
        alias /usr/share/nginx/docs/;
        autoindex on;
        autoindex_format json;
    }

    # mime.types của nginx không có .md -> octet-stream. Khai rõ để mở trực
    # tiếp trên trình duyệt là đọc được, không bị ép tải về.
    location ~* \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
