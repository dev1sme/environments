# icms — Tomcat legacy, context path /icms, chạy `network_mode: host` ở port 18080.
# Compose gốc của nó: dev/project/thomson/bizco/icms/docker-compose.yml
#
# Vì host network nên icms KHÔNG có tên trong Docker DNS và không join env-net.
# Đi qua host.docker.internal (map bằng extra_hosts: host-gateway ở docker-compose.yml).

server {
    listen 80;
    server_name icms.thomson.cba;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name icms.thomson.cba;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;

    # dev.js cùng origin — xem lý do trong snippet
    include /etc/nginx/snippets/dev-badge.conf;

    # Vào thẳng context của app, khỏi phải gõ /icms/
    location = / {
        return 302 /icms/;
    }

    location / {
        # Ở ĐÂY DÙNG UPSTREAM LITERAL, KHÔNG DÙNG BIẾN — ngược với
        # _example.conf.dist. Lý do:
        #
        # host.docker.internal đến từ extra_hosts, tức nằm ở /etc/hosts của
        # container. nginx `resolver` chỉ query DNS, KHÔNG đọc /etc/hosts —
        # nên dạng biến sẽ chết:
        #     host.docker.internal could not be resolved (3: Host not found)
        #
        # Và literal ở đây an toàn: rule "phải dùng biến" tồn tại vì tên
        # container biến mất khỏi Docker DNS khi container tắt. Entry trong
        # /etc/hosts thì luôn có, app tắt hay chạy cũng vậy — nginx vẫn start
        # bình thường, domain này trả 502.
        proxy_pass http://host.docker.internal:18080;

        include /etc/nginx/snippets/proxy-params.conf;

        # Tomcat sau TLS termination không biết request gốc là https, nên
        # sendRedirect() trả về http:// — client bị đẩy sang port 80 rồi mới
        # 301 về lại 443, thêm 1 vòng và mất POST body.
        # Viết lại Location header ngay tại proxy.
        proxy_redirect http://$host/ https://$host/;
        proxy_redirect http://host.docker.internal:18080/ https://$host/;

        # App legacy set cookie không có flag Secure. Thêm vào để browser
        # không cảnh báo và không gửi cookie qua http.
        proxy_cookie_flags ~ secure;
    }
}
