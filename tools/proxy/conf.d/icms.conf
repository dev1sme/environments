# icms — Tomcat legacy, context /icms, listen 18080 trong container.
# Compose: dev/project/thomson/bizco/icms/

server {
    listen 80;
    server_name icms.thomson.cba;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name icms.thomson.cba;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;

    include /etc/nginx/snippets/dev-badge.conf;

    location = / {
        return 302 /icms/;
    }

    location / {
        set $upstream http://icms-tomcat:18080;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $upstream;

        # Tomcat sau TLS termination trả Location: http:// -> thêm 1 vòng
        # redirect và mất POST body. Xem ../README.md
        proxy_redirect http://$host/ https://$host/;
        proxy_redirect http://icms-tomcat:18080/ https://$host/;
        proxy_cookie_flags ~ secure;
    }
}
