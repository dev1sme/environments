# Serve dev.js CÙNG ORIGIN với app. Include vào mỗi `server` block có inject badge.
#
# Trước đây inject `//assets.thomson.cba/dev.js` — cross-origin. Thiết bị chưa
# có CYBRIDGE ASIA Root CA (điện thoại, máy khách) thì:
#   - bấm "tiếp tục" cho icms.thomson.cba  -> trang mở được
#   - assets.thomson.cba là host KHÁC       -> chưa có exception
#   - cert lỗi ở subresource                -> browser CHẶN IM LẶNG, không hỏi
# Kết quả: trang chạy nhưng không có badge, không có lỗi nào nhìn thấy được.
#
# Cùng origin thì script đi chung kết nối với trang — trang mở được là badge lên,
# không cần cài thêm gì trên thiết bị.

location = /__dev/dev.js {
    alias /usr/share/nginx/assets/dev.js;
    default_type application/javascript;
    add_header Cache-Control "no-store";
}
