# Include file này trong mỗi `location` có proxy_pass.
# Mount vào container tại /etc/nginx/snippets/ (xem docker-compose.yml).
#
# Dùng:
#   location / {
#       set $upstream http://app:3000;
#       include /etc/nginx/snippets/proxy-params.conf;
#       proxy_pass $upstream;
#   }

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE. Thiếu 2 dòng này thì socket.io, STOMP over WS,
# Vite HMR đứt lặng — không có log lỗi, chỉ là không connect được.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# sub_filter (inject dev.js ở 00-defaults.conf) không rewrite được response
# đã gzip. Bỏ Accept-Encoding để upstream trả plain text.
# Đây là môi trường dev nên đánh đổi bandwidth lấy inject được là hợp lý.
proxy_set_header Accept-Encoding "";

proxy_buffering off;
