# codegraph — code intelligence cho AI agent qua MCP.
# Mount TRÙNG đường dẫn host (không phải /workspace) vì MCP mode lấy project
# path từ `rootUri` client gửi. Chi tiết + cách bật UI: xem README.md

networks:
  env-net:
    name: env-net

services:
  codegraph:
    build:
      context: .
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    image: env-codegraph:local
    container_name: env-codegraph
    restart: unless-stopped
    # Phải khớp uid host, không thì mkdir .codegraph/ là EACCES
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ${PROJECTS_ROOT}:${PROJECTS_ROOT}
    environment:
      # Tắt telemetry, GIỮ update check (DO_NOT_TRACK sẽ tắt cả hai)
      CODEGRAPH_TELEMETRY: "0"
    networks:
      - env-net
